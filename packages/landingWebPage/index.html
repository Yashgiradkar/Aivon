<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aivon — AI Customer Support Platform | Flagship Project Showcase</title>
    <meta
      name="description"
      content="Aivon is a multi-tenant AI customer support platform combining RAG, agentic workflows, real-time chat, voice support, and enterprise BYOK security."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CDN for instant standalone styling with no build dependency overhead -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#05070d",
              secondary: "#b7ae9d",
              tertiary: "#17130e",
              "black-100": "#100d09",
              "black-200": "#0a0907",
              gold: "#d6a84b",
              "gold-light": "#ffd784",
            },
            fontFamily: {
              sans: ["'Plus Jakarta Sans'", "sans-serif"],
              mono: ["'JetBrains Mono'", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #05070d;
        color: #f7f1e6;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      ::selection {
        background: #d6a84b;
        color: #17130e;
      }
      /* Custom glowing scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #05070d;
      }
      ::-webkit-scrollbar-thumb {
        background: #2b2115;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d6a84b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
